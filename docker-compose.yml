services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - ENVIRONMENT=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  bot:
    build: ./bot
    env_file: .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # Production Services (Raspberry Pi / Server Deployment)
  # No exposed ports to host; uses host-gateway for LLM and log rotation
  # Run with: docker compose up -d api-prod bot-prod
  # =========================================================================
  api-prod:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tracking_meme_api_prod
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - GEMINI_SERVICE_URL=http://host.docker.internal:8000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot-prod:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: tracking_meme_bot_prod
    env_file: .env
    environment:
      - API_BASE_URL=http://api-prod:8000
      - ENVIRONMENT=production
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      api-prod:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
